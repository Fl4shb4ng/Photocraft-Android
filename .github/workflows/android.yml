name: Android
on:
  workflow_dispatch:
  push:
    paths: ['apps/photocraft-android/**', 'packaging/android/**', 'assets/app-icon/**', 'crates/**', 'Cargo.*', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/photocraft-android/**', 'packaging/android/**', 'assets/app-icon/**', 'crates/**', 'Cargo.*', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: packaging/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Android-arm64
          path: dist/android/PhotoCraft-arm64-v8a.apk*
